<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin App</title>
    <link rel="stylesheet" href="/css/spin-styles.css">
</head>
<body>

<div class="wrapper">
    <section class="phone">
        <div class="screen">

            <div class="top-box">
                <h1>TITEL/GRAFIK</h1>
            </div>

            <form action="stw/result" method="post" class="options">
                <div class="option-row">
                    <div class="circle"></div>
                    <input type="text" name="option1" class="option-input" placeholder="Mulighed 1">
                </div>

                <div class="option-row">
                    <div class="circle"></div>
                    <input type="text" name="option2" class="option-input" placeholder="Mulighed 2">
                </div>

                <div class="option-row">
                    <div class="circle"></div>
                    <input type="text" name="option3" class="option-input" placeholder="Mulighed 3">
                </div>

                <div class="option-row">
                    <div class="circle"></div>
                    <input type="text" name="option4" class="option-input" placeholder="Mulighed 4">
                </div>

                <div class="option-row">
                    <div class="circle"></div>
                    <input type="text" name="option5" class="option-input" placeholder="Mulighed 5">
                </div>

                <button type="submit" class="main-btn">SPIN</button>
            </form>

        </div>
    </section>
</div>

</body>
</html>
